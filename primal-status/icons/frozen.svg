<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Original icon: a six-armed snowflake -->
  <g stroke="#ffffff" stroke-width="7" stroke-linecap="round" fill="none">
    <g id="arm">
      <path d="M50 50 L50 8"/>
      <path d="M50 22 L40 14 M50 22 L60 14"/>
      <path d="M50 36 L38 28 M50 36 L62 28"/>
    </g>
    <use href="#arm" transform="rotate(60 50 50)"/>
    <use href="#arm" transform="rotate(120 50 50)"/>
    <use href="#arm" transform="rotate(180 50 50)"/>
    <use href="#arm" transform="rotate(240 50 50)"/>
    <use href="#arm" transform="rotate(300 50 50)"/>
  </g>
  <circle cx="50" cy="50" r="8" fill="#ffffff"/>
</svg>
